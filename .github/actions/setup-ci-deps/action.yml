name: Setup CI dependencies
description: Install Vite+ and the workspace dependencies, from cache when possible.
runs:
  using: composite
  steps:
    # setup-vp reuses an installed exact version, so caching its home skips the
    # installer download on every run.
    - name: Resolve Vite+ version
      id: vp
      shell: bash
      run: |
        echo "version=$(sed -nE 's/^  vite-plus: ([0-9][^ ]*)$/\1/p' pnpm-workspace.yaml)" >> "$GITHUB_OUTPUT"

    - name: Cache Vite+
      if: steps.vp.outputs.version != ''
      uses: actions/cache@v6
      with:
        path: ~/.vite-plus
        key: vite-plus-home-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.vp.outputs.version }}

    - name: Setup Vite+
      uses: voidzero-dev/setup-vp@v1
      with:
        node-version-file: package.json
        cache: true
        run-install: true

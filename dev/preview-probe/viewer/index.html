<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; connect-src ws://127.0.0.1:*; style-src 'self' 'unsafe-inline'"
    />
    <title>Playstead preview probe</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #000;
        overflow: hidden;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: contain;
        outline: none;
      }
      #status {
        position: fixed;
        left: 8px;
        bottom: 8px;
        padding: 4px 8px;
        font:
          12px ui-monospace,
          monospace;
        color: #fff;
        background: rgb(0 0 0 / 65%);
        pointer-events: none;
        white-space: pre;
      }
    </style>
  </head>
  <body>
    <canvas id="frame" width="1280" height="720" tabindex="0"></canvas>
    <div id="status" role="status">Waiting for the game…</div>
    <script src="viewer.js"></script>
  </body>
</html>
